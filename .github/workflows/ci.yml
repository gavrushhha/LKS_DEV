name: CI

on:
  push:
    paths:
      - "**/*.py"
      - "backend/pyproject.toml"
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/alembic.ini"
      - "backend/openapi/**"
      - "!backend/openapi/**/*.md"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "backend/pyproject.toml"
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/alembic.ini"
      - "backend/openapi/**"
      - "!backend/openapi/**/*.md"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Format check
        run: ruff format --check app tests
      - name: Types
        run: mypy app
      - name: Tests
        run: pytest -q -m "not integration and not e2e"
      - name: OpenAPI export
        run: python scripts/export_openapi.py
      - name: Upload OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: backend-openapi
          path: backend/openapi/generated.json
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lks
          POSTGRES_PASSWORD: lks
          POSTGRES_DB: lks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lks -d lks"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: lks
          RABBITMQ_DEFAULT_PASS: lks
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      LKS_RUN_INTEGRATION: "1"
      APP_ENV: dev
      LKS_DB_DSN: postgresql+asyncpg://lks:lks@localhost:5432/lks
      TANDEM_DB_DSN: postgresql+asyncpg://lks:lks@localhost:5432/lks
      REDIS_DSN: redis://localhost:6379/0
      RABBITMQ_DSN: amqp://lks:lks@localhost:5672/
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Integration tests
        run: pytest -q -m integration

  image:
    needs: [backend, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
